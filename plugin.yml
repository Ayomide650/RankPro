name: RankPro
version: 2.0.0
main: RankPro\Main
api: 5.0.0
author: Firekid846
description: XP-based rank progression system

commands:
  xpbal:
    description: Check your XP and rank
    usage: "/xpbal [player]"
    aliases: ["xp", "rank"]
    permission: rankpro.use
  rankadmin:
    description: Admin rank commands
    usage: "/rankadmin <give|take|set|setrank|reset|list>"
    permission: rankpro.admin

permissions:
  rankpro.use:
    description: Check XP and ranks
    default: true
  rankpro.admin:
    description: Manage XP and ranks
    default: op
